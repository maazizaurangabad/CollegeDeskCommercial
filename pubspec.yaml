name: shiksha_desk
description: Shiksha Desk - offline-first education management platform.
publish_to: 'none'
version: 1.0.0+26

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  drift: ^2.32.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^10.3.7
  google_mlkit_document_scanner: ^0.4.0
  image_picker: ^1.1.2
  cryptography: ^2.7.0
  archive: ^3.6.1
  xml: ^6.5.0
  image: ^4.2.0
  local_auth: ^3.0.1
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Noto Sans (SIL Open Font License), bundled so PDFs work offline.
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

# Bundle SQLite3MultipleCiphers (encrypted SQLite) on every platform.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
